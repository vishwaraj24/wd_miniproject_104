<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Habit Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f1f5f9;
}

/* MAIN CARD */
.container{
  width:400px;
  padding:25px;
  border-radius:20px;
  background:#ffffff;
  box-shadow:0 10px 40px rgba(0,0,0,0.1);
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.header h1{
  font-size:20px;
  color:#111;
}

/* CIRCLE PROGRESS */
.circle{
  width:80px;
  height:80px;
  border-radius:50%;
  background:conic-gradient(#22c55e 0%, #e5e7eb 0%);
  display:flex;
  justify-content:center;
  align-items:center;
  transition:0.3s;
}

.circle span{
  font-size:14px;
  color:#111;
}

/* STREAK */
.streak{
  display:flex;
  justify-content:space-between;
  margin:20px 0;
}

.streak div{
  background:#f8fafc;
  padding:12px;
  border-radius:12px;
  width:48%;
  text-align:center;
}

.streak h2{
  color:#22c55e;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.day{
  height:45px;
  border-radius:10px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  transition:0.25s;
  cursor:pointer;
}

/* COMPLETED */
.completed{
  background:#22c55e;
  color:#fff;
  box-shadow:0 5px 15px rgba(34,197,94,0.4);
}

/* TODAY */
.today{
  border:2px solid #3b82f6;
}

/* HOVER */
.day:hover{
  transform:translateY(-3px);
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🔥 Habit Tracker</h1>
    <div class="circle" id="circle"><span id="percent">0%</span></div>
  </div>

  <div class="streak">
    <div>
      <p>Current</p>
      <h2 id="current">0 🔥</h2>
    </div>
    <div>
      <p>Best</p>
      <h2 id="best">0 🏆</h2>
    </div>
  </div>

  <div class="grid" id="grid"></div>

</div>

<script>

const grid = document.getElementById("grid");
const percentText = document.getElementById("percent");
const circle = document.getElementById("circle");
const currentEl = document.getElementById("current");
const bestEl = document.getElementById("best");

let days = JSON.parse(localStorage.getItem("habitDays")) || [];

// CREATE 30 DAYS
for(let i=1;i<=30;i++){
  const div = document.createElement("div");
  div.classList.add("day");
  div.innerText = i;

  if(days.includes(i)){
    div.classList.add("completed");
  }

  // mark today (demo: 9)
  if(i === new Date().getDate()){
    div.classList.add("today");
  }

  div.addEventListener("click",()=>{
    div.classList.toggle("completed");

    if(div.classList.contains("completed")){
      days.push(i);
    } else {
      days = days.filter(d=>d!==i);
    }

    localStorage.setItem("habitDays",JSON.stringify(days));
    updateUI();
  });

  grid.appendChild(div);
}

// UPDATE UI
function updateUI(){

  let count = days.length;

  // percentage
  let percent = Math.floor((count/30)*100);
  percentText.innerText = percent + "%";
  circle.style.background = `conic-gradient(#22c55e ${percent}%, #e5e7eb 0%)`;

  // streak calculation
  let sorted = [...days].sort((a,b)=>a-b);
  let streak = 0;
  let best = 0;

  for(let i=0;i<sorted.length;i++){
    if(i===0 || sorted[i] === sorted[i-1]+1){
      streak++;
      best = Math.max(best, streak);
    } else {
      streak = 1;
    }
  }

  currentEl.innerText = streak + " 🔥";
  bestEl.innerText = best + " 🏆";
}

updateUI();

</script>

</body>
</html>
