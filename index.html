<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Habit Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top,#0f172a,#020617);
  overflow:hidden;
}

/* BACKGROUND GLOW */
body::before{
  content:'';
  position:absolute;
  width:400px;
  height:400px;
  background:linear-gradient(45deg,#22c55e,#00f7ff);
  filter:blur(120px);
  animation:move 8s infinite alternate;
}

@keyframes move{
  from{transform:translate(-100px,-100px);}
  to{transform:translate(100px,100px);}
}

/* MAIN CARD */
.container{
  width:380px;
  padding:25px;
  border-radius:20px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;
  position:relative;
  z-index:1;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.header h1{
  font-size:20px;
}

/* CIRCLE PROGRESS */
.circle{
  width:80px;
  height:80px;
  border-radius:50%;
  background:conic-gradient(#22c55e 65%, #1e293b 0);
  display:flex;
  justify-content:center;
  align-items:center;
}

.circle span{
  font-size:14px;
}

/* STREAK */
.streak{
  display:flex;
  justify-content:space-between;
  margin:20px 0;
}

.streak div{
  background:rgba(255,255,255,0.08);
  padding:10px;
  border-radius:10px;
  width:48%;
  text-align:center;
}

.streak h2{
  color:#22c55e;
}

/* CALENDAR GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}

.day{
  height:40px;
  border-radius:8px;
  background:#020617;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.3s;
}

/* COMPLETED */
.completed{
  background:linear-gradient(135deg,#22c55e,#4ade80);
  color:#000;
  box-shadow:0 0 12px #22c55e;
}

/* HOVER */
.day:hover{
  transform:translateY(-5px) scale(1.05);
  cursor:pointer;
}

/* TODAY */
.today{
  border:1px solid #00f7ff;
  box-shadow:0 0 10px #00f7ff;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🔥 Habit Tracker</h1>
    <div class="circle"><span>65%</span></div>
  </div>

  <div class="streak">
    <div>
      <p>Current</p>
      <h2>9 🔥</h2>
    </div>
    <div>
      <p>Best</p>
      <h2>18 🏆</h2>
    </div>
  </div>

  <div class="grid">

    <!-- 30 Days -->
    <div class="day completed">1</div>
    <div class="day completed">2</div>
    <div class="day completed">3</div>
    <div class="day completed">4</div>
    <div class="day completed">5</div>
    <div class="day completed">6</div>
    <div class="day completed">7</div>

    <div class="day completed">8</div>
    <div class="day today">9</div>
    <div class="day">10</div>
    <div class="day">11</div>
    <div class="day">12</div>
    <div class="day">13</div>
    <div class="day">14</div>

    <div class="day">15</div>
    <div class="day">16</div>
    <div class="day">17</div>
    <div class="day">18</div>
    <div class="day">19</div>
    <div class="day">20</div>
    <div class="day">21</div>

    <div class="day">22</div>
    <div class="day">23</div>
    <div class="day">24</div>
    <div class="day">25</div>
    <div class="day">26</div>
    <div class="day">27</div>
    <div class="day">28</div>

    <div class="day">29</div>
    <div class="day">30</div>

  </div>

</div>

</body>
</html>
